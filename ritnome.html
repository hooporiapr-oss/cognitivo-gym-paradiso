<script>
(function(){
var $=id=>document.getElementById(id);

// ══════════════════════════════════════════════════════
//  STANDINGS — its own dedicated table, entirely separate from
//  every other game's board on the platform. Every genuinely
//  completed run gets recorded — pattern, total flashes, and hits
//  scored all saved alongside the time, since Go No Go and
//  Reaction Speed each score by hit count, not by time at all.
// ══════════════════════════════════════════════════════
var SB_URL='https://sdaphocueugzfvjovuxd.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkYXBob2N1ZXVnemZ2am92dXhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MjQyMDgsImV4cCI6MjA5OTIwMDIwOH0.pDAzf4P6dD9eNEBlnP95SdF5BI-R84-Rdc0vKzYcn7M';
var SB_TABLE='ritnome_standings';
// The age group of the code this session came in with ('' = none).
function myCategory(){try{return sessionStorage.getItem('ritnome-category')||''}catch(e){return ''}}
var currentPlayerName='';

function recordScoreToStandings(name,pattern,timeSeconds,flashes,hitsScored){
  return fetch(SB_URL+'/rest/v1/'+SB_TABLE,{
    method:'POST',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({player_name:name,pattern:pattern,time_seconds:timeSeconds,total_flashes:flashes,hits_scored:(hitsScored===undefined?null:hitsScored),school_name:sessionStorage.getItem('ritnome-school')||null,category:myCategory()||null})
  }).catch(function(){});
}

$('playerNameInputMain').addEventListener('keydown',function(e){
  if(e.key==='Enter')$('introStartBtn').click();
});

var ROWS=5,COLS=10,TOTAL_CELLS=50;
// SPEED — chosen on the intro screen. 'free' has no beat at all: the
// ball waits until it is tapped, then moves, for 25 targets, and the
// player's own BPM is measured. The others are fixed beats; 80 BPM is
// the original setting and stays the default.
var SPEEDS=[20,40,60,80,100,120];
var currentSpeed=80;
function isFree(){return currentSpeed==='free'}
function getCurrentBPM(){return isFree()?0:currentSpeed}
// One standings key per pattern and speed. 80 BPM keeps the plain
// pattern name, so every run already on the board stays where it is.
function standingsKey(pattern,speed){
  if(speed==='free')return 'free';
  return speed===80?pattern:pattern+'@'+speed;
}
var currentPattern='gonogo';
// Ritnome is now a fixed 25 hits, always — one comparable time per
// pattern, not split across two different target counts.
var currentTargetCount=25;

var BASKETBALL_ORANGE='#ff6b35';
var BALL_SEAMS="url('data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Cdefs%3E%3CclipPath%20id%3D%22c%22%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2249%22/%3E%3C/clipPath%3E%3C/defs%3E%3Cg%20clip-path%3D%22url%28%23c%29%22%20fill%3D%22none%22%20stroke%3D%22rgba%280%2C0%2C0%2C.4%29%22%20stroke-width%3D%223.4%22%3E%3Cline%20x1%3D%2250%22%20y1%3D%22-4%22%20x2%3D%2250%22%20y2%3D%22104%22/%3E%3Cpath%20d%3D%22M%20-4%2050%20Q%2050%20-4%20104%2050%22/%3E%3Cpath%20d%3D%22M%20-4%2050%20Q%2050%20104%20104%2050%22/%3E%3Cellipse%20cx%3D%2250%22%20cy%3D%2250%22%20rx%3D%2224%22%20ry%3D%2249%22/%3E%3C/g%3E%3C/svg%3E')";

var PATTERN_LABELS={gonogo:'Go No Go',random:'Reaction Speed'};

function introInfoHTML(){
  if(isFree())return '<strong>Free Tap</strong> — no beat. The ball waits for you: tap it and it moves. <strong>25 targets</strong>. We time you and measure <strong>your BPM</strong> — taps per minute.';
  var b='<strong>'+currentSpeed+' BPM</strong>';
  if(currentPattern==='gonogo')return b+'. Tap only when it flashes <strong style="color:#ff6b35">orange</strong> — the round runs until <strong>25 total oranges</strong> have flashed. Score is how many of those 25 you actually hit.';
  return b+'. Race to <strong>25 hits</strong> — reach it and the round ends right there. Miss too many, and it runs up to <strong>100 flashes</strong> total. Score is hits out of whichever you actually hit.';
}
function refreshIntro(){
  $('introInfo').innerHTML=introInfoHTML();
  $('patternRow').hidden=isFree();     // Free Tap is its own game: every ball is a target
  $('ritRule').textContent=isFree()?'The ball waits for you. Tap it and it moves.':'The beat never waits. Tap as many as you can.';
}
document.querySelectorAll('.pattern-btn').forEach(function(btn){
  btn.onclick=function(){
    currentPattern=btn.dataset.pattern;
    document.querySelectorAll('.pattern-btn').forEach(function(b){b.classList.remove('active')});
    btn.classList.add('active');
    refreshIntro();
  };
});
document.querySelectorAll('.speed-btn').forEach(function(btn){
  btn.onclick=function(){
    currentSpeed=btn.dataset.speed==='free'?'free':parseInt(btn.dataset.speed,10);
    document.querySelectorAll('.speed-btn').forEach(function(b){b.classList.toggle('active',b===btn)});
    refreshIntro();
  };
});
refreshIntro();
if(myCategory())$('introCat').textContent=' · '+myCategory();

// ---- Audio: a synthesized dribble thump, not a sample. A low
// sine sweep gives the thud its body; a short filtered noise burst
// on top gives it the percussive slap of a ball meeting the floor.
var audioCtx=null;
function ensureAudio(){
  if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
}
function playThump(){
  if(!audioCtx)return;
  var now=audioCtx.currentTime;
  var osc=audioCtx.createOscillator();
  var oscGain=audioCtx.createGain();
  osc.type='sine';
  osc.frequency.setValueAtTime(130,now);
  osc.frequency.exponentialRampToValueAtTime(46,now+0.1);
  oscGain.gain.setValueAtTime(.001,now);
  oscGain.gain.exponentialRampToValueAtTime(.85,now+0.006);
  oscGain.gain.exponentialRampToValueAtTime(.001,now+0.16);
  osc.connect(oscGain);oscGain.connect(audioCtx.destination);
  osc.start(now);osc.stop(now+0.17);

  var bufSize=Math.floor(audioCtx.sampleRate*0.035);
  var buf=audioCtx.createBuffer(1,bufSize,audioCtx.sampleRate);
  var data=buf.getChannelData(0);
  for(var i=0;i<bufSize;i++){data[i]=(Math.random()*2-1)*(1-i/bufSize)}
  var noise=audioCtx.createBufferSource();
  noise.buffer=buf;
  var noiseFilter=audioCtx.createBiquadFilter();
  noiseFilter.type='lowpass';
  noiseFilter.frequency.value=900;
  var noiseGain=audioCtx.createGain();
  noiseGain.gain.setValueAtTime(.22,now);
  noiseGain.gain.exponentialRampToValueAtTime(.001,now+0.035);
  noise.connect(noiseFilter);noiseFilter.connect(noiseGain);noiseGain.connect(audioCtx.destination);
  noise.start(now);
}

// ══════════════════════════════════════════════════════
//  PATTERNS — the beat never waits. Every tick, the light advances
//  to the next position in whichever pattern is selected,
//  regardless of whether the player tapped the previous one in
//  time. No miss penalty, just no hit counted.
// ══════════════════════════════════════════════════════
function idxOf(row,col){return row*COLS+col}

var GO_COLOR='#ff6b35';
var NOGO_COLORS=['#00e5ff','#ffd23f','#3ddc72','#a855f7','#c9c9d4','#ff3b8d'];
var currentIsGo=false;
function nextGoNoGo(){return Math.floor(Math.random()*TOTAL_CELLS)}

function nextRandom(){return Math.floor(Math.random()*TOTAL_CELLS)}

var PATTERNS={gonogo:nextGoNoGo,random:nextRandom};

// ── Court ──
var cells=[];
function buildCourt(){
  var court=$('court');court.innerHTML='';cells=[];
  for(var i=0;i<TOTAL_CELLS;i++){
    var c=document.createElement('div');
    c.className='cell';
    c.dataset.i=i;
    c.addEventListener('pointerdown',(function(idx){return function(e){e.preventDefault();handleTap(idx)}})(i));
    court.appendChild(c);
    cells.push(c);
  }
}
function litCell(idx,forceColor){
  var cell=cells[idx];
  var color=forceColor||BASKETBALL_ORANGE;
  cell.style.setProperty('--lit-color',color);
  cell.style.background=BALL_SEAMS+', radial-gradient(circle at 35% 35%,'+color+','+color+'aa)';
  cell.style.backgroundSize='100% 100%, 100% 100%';
  cell.classList.remove('lit');
  void cell.offsetWidth;
  cell.classList.add('lit');
}
function clearCell(idx){
  var cell=cells[idx];
  cell.classList.remove('lit');
  cell.style.background='';
}
function msg(txt,cls){var el=$('msg');el.textContent=txt;el.className='msg-bar '+(cls||'watch')}

// ── Game state ──
var phase='idle';
var currentIdx=-1;
var hits=0;
var totalFlashes=0;
var redCount=0;
var roundEnding=false;
var startTime=0;
var timerRAF=null;
var schedulerId=null;
var nextBeatTime=0;

var hasTappedCurrent=false;
function advance(){
  totalFlashes++;
  hasTappedCurrent=false;
  if(currentIdx>=0)clearCell(currentIdx);
  currentIdx=PATTERNS[currentPattern]();
  if(currentPattern==='gonogo'){
    var chance=0.14+Math.random()*0.16;
    currentIsGo=Math.random()<chance;
    litCell(currentIdx,currentIsGo?GO_COLOR:NOGO_COLORS[Math.floor(Math.random()*NOGO_COLORS.length)]);
    if(currentIsGo){
      redCount++;
      $('hBest').textContent=Math.max(0,25-redCount);
      if(redCount>=25){
        // The 25th red still gets its own full, fair flash window —
        // the round only actually ends once that response window
        // has passed, whether the player tapped it or not.
        roundEnding=true;
        scheduleRoundEnd();
      }
    }
  }else{
    currentIsGo=true;
    litCell(currentIdx);
    if(currentPattern==='random'){
      $('hBest').textContent=Math.max(0,100-totalFlashes);
      if(totalFlashes>=100){
        roundEnding=true;
        scheduleRoundEnd();
      }
    }
  }
  playThump();
}

function scheduleRoundEnd(){
  setTimeout(function(){
    if(phase!=='tapping')return;
    if(currentPattern==='gonogo')finishGoNoGoRound();
    else if(currentPattern==='random')finishReactionSpeedRound(false);
  },60000/getCurrentBPM());
}

function scheduleLoop(){
  if(phase!=='tapping'||roundEnding)return;
  while(nextBeatTime<audioCtx.currentTime+0.12){
    advance();
    nextBeatTime+=60/getCurrentBPM();
    if(roundEnding)break;
  }
  schedulerId=setTimeout(scheduleLoop,25);
}

// FREE TAP: no scheduler. One ball at a time; a tap moves it.
function freeNext(){
  var prev=currentIdx,next;
  do{next=Math.floor(Math.random()*TOTAL_CELLS)}while(next===prev);
  if(prev>=0)clearCell(prev);
  currentIdx=next;currentIsGo=true;hasTappedCurrent=false;totalFlashes++;
  litCell(currentIdx);
  playThump();
}
function measuredBPM(n,seconds){return seconds>0?Math.round(n*60/seconds):0}
function finishFreeRound(){
  var finalTime=(performance.now()-startTime)/1000;
  stopRound();
  var bpm=measuredBPM(currentTargetCount,finalTime);
  $('hTime').textContent=finalTime.toFixed(1);
  $('hTempo').textContent=bpm+' BPM';
  recordScoreToStandings(currentPlayerName,'free',finalTime,currentTargetCount,currentTargetCount);
  msg('🏆 25/25 — '+finalTime.toFixed(1)+'s · '+bpm+' BPM','perfect');
  $('actBtn').textContent='PLAY AGAIN';
  $('actBtn').disabled=false;
}

function updateTimerDisplay(){
  if(phase!=='tapping')return;
  var elapsed=(performance.now()-startTime)/1000;
  $('hTime').textContent=elapsed.toFixed(1);
  if(isFree())$('hTempo').textContent=(hits?measuredBPM(hits,elapsed):'--')+' BPM';
  timerRAF=requestAnimationFrame(updateTimerDisplay);
}

function startRound(){
  if(phase==='tapping')return;
  ensureAudio();
  if(audioCtx.state==='suspended')audioCtx.resume();

  currentIsGo=false;

  phase='tapping';
  currentIdx=-1;
  hits=0;
  totalFlashes=0;
  redCount=0;
  roundEnding=false;
  $('hHits').textContent='0/'+currentTargetCount;
  $('hTime').textContent='0.0';
  setTopbar();
  msg('⚡ GO! TAP THE BALL','go');
  $('actBtn').disabled=true;

  startTime=performance.now();
  if(isFree()){
    freeNext();
    timerRAF=requestAnimationFrame(updateTimerDisplay);
    return;
  }
  nextBeatTime=audioCtx.currentTime+0.05;
  scheduleLoop();
  timerRAF=requestAnimationFrame(updateTimerDisplay);
}

function stopRound(){
  phase='idle';
  if(schedulerId)clearTimeout(schedulerId);
  if(timerRAF)cancelAnimationFrame(timerRAF);
  if(currentIdx>=0)clearCell(currentIdx);
  currentIdx=-1;
}

function handleTap(idx){
  if(phase!=='tapping'||idx!==currentIdx)return;
  if(hasTappedCurrent)return;
  hasTappedCurrent=true;
  if(isFree()){
    hits++;
    $('hHits').textContent=hits+'/'+currentTargetCount;
    $('hBest').textContent=currentTargetCount-hits;
    if(hits>=currentTargetCount)finishFreeRound();
    else freeNext();
    return;
  }
  if(currentPattern==='gonogo'){
    // No round-ending penalty here — Go No Go is a fixed-length
    // challenge (25 total red appearances), not a
    // survive-until-a-mistake one. Tapping a non-red cell simply
    // doesn't count, and the round just continues.
    if(!currentIsGo)return;
    hits++;
    $('hHits').textContent=hits+'/'+currentTargetCount;
    return;
  }
  if(currentPattern==='random'){
    hits++;
    $('hHits').textContent=hits+'/'+currentTargetCount;
    if(hits>=25){
      finishReactionSpeedRound(true);
    }
    return;
  }
}

function finishGoNoGoRound(){
  var finalTime=(performance.now()-startTime)/1000;
  stopRound();
  recordScoreToStandings(currentPlayerName,standingsKey(currentPattern,currentSpeed),finalTime,totalFlashes,hits);
  msg('✅ DONE — '+hits+'/25 ORANGE HITS','perfect');
  $('actBtn').textContent='PLAY AGAIN';
  $('actBtn').disabled=false;
}

function finishReactionSpeedRound(reachedTarget){
  var finalTime=(performance.now()-startTime)/1000;
  stopRound();
  recordScoreToStandings(currentPlayerName,standingsKey(currentPattern,currentSpeed),finalTime,totalFlashes,hits);
  var denom=reachedTarget?25:100;
  $('hHits').textContent=hits+'/'+denom;
  msg((reachedTarget?'🏆 25/25 — ':'✅ DONE — ')+hits+'/'+denom+' HITS','perfect');
  $('actBtn').textContent='PLAY AGAIN';
  $('actBtn').disabled=false;
}

// Keeps the court at a true 2:1 ratio (matching the drawn court
// background exactly), fitting the largest size that stays inside
// the available area.
function resizeCourtToFit(){
  var area=document.querySelector('.court-area');
  var court=$('court');
  if(!area||!court)return;
  var areaW=area.clientWidth;
  var areaH=area.clientHeight;
  if(!areaW||!areaH)return;
  var targetW=areaW;
  var targetH=targetW/2;
  if(targetH>areaH){
    targetH=areaH;
    targetW=targetH*2;
  }
  court.style.width=targetW+'px';
  court.style.height=targetH+'px';
}
window.addEventListener('resize',resizeCourtToFit);

function setTopbar(){
  $('hHits').textContent='0/'+currentTargetCount;
  if(isFree()){
    $('hTempo').textContent='-- BPM';
    $('hPattern').textContent='Free Tap';
    $('hBestLbl').textContent='Left';
    $('hBest').textContent=currentTargetCount;
    return;
  }
  $('hTempo').textContent=getCurrentBPM()+' BPM';
  $('hPattern').textContent=PATTERN_LABELS[currentPattern];
  if(currentPattern==='gonogo'){
    $('hBestLbl').textContent='Reds Left';
    $('hBest').textContent='25';
  }else{
    $('hBestLbl').textContent='Flashes Left';
    $('hBest').textContent='100';
  }
}

function launchGame(nm){
  currentPlayerName=nm.slice(0,20);
  $('screen-intro').style.display='none';$('screen-game').style.display='flex';
  buildCourt();
  resizeCourtToFit();
  setTopbar();
  msg(isFree()?"TAP LET'S GO! — THE BALL MOVES WHEN YOU TAP IT":"TAP LET'S GO!",'watch');
  try{ if(!document.fullscreenElement && document.documentElement.requestFullscreen){ document.documentElement.requestFullscreen().catch(function(){}); } }catch(e){}
}

// ══════════════════════════════════════════════════════
//  STANDINGS DISPLAY — one shared table, filtered by pattern per
//  tab. Hit count is the score for both patterns, so more is
//  better.
// ══════════════════════════════════════════════════════
var STANDINGS_PATTERNS=[
  {key:'gonogo',label:'Go No Go'},
  {key:'random',label:'Reaction Speed'},
  {key:'free',label:'Free Tap'}
];
var currentStandingsPattern='gonogo';
var currentStandingsSpeed=80;
// '' = All. Opens on the player's own age group when the code has one.
var currentStandingsCategory=myCategory();
function catSort(a,b){var x=parseInt(a,10),y=parseInt(b,10);if(!isNaN(x)&&!isNaN(y)&&x!==y)return x-y;return a.localeCompare(b)}
function renderCategoryTabs(cats){
  var row=$('standingsCatRow');
  if(currentStandingsCategory&&cats.indexOf(currentStandingsCategory)===-1)cats=cats.concat([currentStandingsCategory]).sort(catSort);
  if(!cats.length){row.hidden=true;row.innerHTML='';return}
  row.hidden=false;
  row.innerHTML=[''].concat(cats).map(function(c){
    var safe=c.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    return '<button class="standings-tab'+(c===currentStandingsCategory?' active':'')+'" data-cat="'+safe+'">'+(c?safe:'All')+'</button>';
  }).join('');
  row.querySelectorAll('.standings-tab').forEach(function(btn){
    btn.addEventListener('click',function(){currentStandingsCategory=btn.dataset.cat;renderStandingsForPattern(currentStandingsPattern)});
  });
}

function fetchStandingsFor(patternKey){
  // Scoped to the current session's own school — two different
  // access codes are two genuinely separate boards. Runs hidden in
  // the admin (cadapunto.com/standings.html) stay on file, off the board.
  var school=sessionStorage.getItem('ritnome-school')||'';
  var url=SB_URL+'/rest/v1/'+SB_TABLE+'?select=player_name,time_seconds,total_flashes,hits_scored,category&pattern=eq.'+encodeURIComponent(patternKey)+'&school_name=eq.'+encodeURIComponent(school)+'&hidden=is.false';
  return fetch(url,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}})
    .then(function(r){if(!r.ok)throw new Error('bad response');return r.json()})
    .then(function(rows){
      var cats={};
      (rows||[]).forEach(function(r){var c=(r.category||'').trim();if(c)cats[c]=1});
      renderCategoryTabs(Object.keys(cats).sort(catSort));
      var best={};
      (rows||[]).forEach(function(r){
        if(currentStandingsCategory&&(r.category||'').trim()!==currentStandingsCategory)return;
        var existing=best[r.player_name];
        if(!existing||(patternKey==='free'?r.time_seconds<existing.time:r.hits_scored>existing.hitsScored)){
          best[r.player_name]={name:r.player_name,time:r.time_seconds,flashes:r.total_flashes,hitsScored:r.hits_scored};
        }
      });
      var list=Object.keys(best).map(function(n){return best[n]});
      if(patternKey==='free')return list.sort(function(a,b){return a.time-b.time});
      return list.sort(function(a,b){return b.hitsScored-a.hitsScored});
    });
}

function renderStandingsTabs(){
  var row=$('standingsTabRow');
  row.innerHTML=STANDINGS_PATTERNS.map(function(p){
    return '<button class="standings-tab'+(p.key===currentStandingsPattern?' active':'')+'" data-key="'+p.key+'">'+p.label+'</button>';
  }).join('');
  row.querySelectorAll('.standings-tab').forEach(function(btn){
    btn.addEventListener('click',function(){renderStandingsForPattern(btn.dataset.key)});
  });
  var sp=$('standingsSpeedRow');
  sp.hidden=currentStandingsPattern==='free';
  sp.innerHTML=SPEEDS.map(function(v){
    return '<button class="standings-tab'+(v===currentStandingsSpeed?' active':'')+'" data-speed="'+v+'">'+v+' BPM</button>';
  }).join('');
  sp.querySelectorAll('.standings-tab').forEach(function(btn){
    btn.addEventListener('click',function(){currentStandingsSpeed=parseInt(btn.dataset.speed,10);renderStandingsForPattern(currentStandingsPattern)});
  });
}

function renderStandingsForPattern(patternKey){
  currentStandingsPattern=patternKey;
  var patternConfig=STANDINGS_PATTERNS.filter(function(p){return p.key===patternKey})[0];
  var isGoNoGo=patternKey==='gonogo';
  var isFreeBoard=patternKey==='free';
  renderStandingsTabs();
  $('standingsLabel').textContent=isFreeBoard?'Standings — Best BPM Per Player':'Standings — Best Hit Count Per Player';
  $('boxSub').textContent=patternConfig.label+(isFreeBoard?' · Fastest 25 Taps · Your BPM':(' · '+currentStandingsSpeed+' BPM')+(isGoNoGo?' · Most Hits Out Of 25 Reds':' · Most Hits (25 Cap, 100 Max Flashes)'));
  var listEl=$('standingsList');
  listEl.innerHTML='<div class="box-empty">Loading standings…</div>';

  fetchStandingsFor(isFreeBoard?'free':standingsKey(patternKey,currentStandingsSpeed)).then(function(ranked){
    if(!ranked.length){
      listEl.innerHTML='<div class="box-empty">No players yet — be the first name on the board.</div>';
      return;
    }
    listEl.innerHTML=ranked.map(function(p,i){
      var rankClass=i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'';
      var safeName=p.name.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      var flashesDisplay=(p.flashes===null||p.flashes===undefined)?'--':p.flashes;
      var mainScore;
      if(isFreeBoard){
        var tt=Number(p.time)||0;
        return '<div class="standings-row standings-row-flat '+rankClass+'">'
          +'<div class="standings-row-main">'
            +'<span class="standings-rank">'+(i+1)+'</span>'
            +'<span class="standings-name">'+safeName+'</span>'
            +'<span><span class="standings-pts">'+measuredBPM(25,tt)+' BPM</span><span class="standings-pts-sub">25 Taps: '+tt.toFixed(1)+'s</span></span>'
          +'</div>'
          +'</div>';
      }
      if(isGoNoGo){
        mainScore=(p.hitsScored===null||p.hitsScored===undefined?'--':p.hitsScored)+'/25';
        return '<div class="standings-row standings-row-flat '+rankClass+'">'
          +'<div class="standings-row-main">'
            +'<span class="standings-rank">'+(i+1)+'</span>'
            +'<span class="standings-name">'+safeName+'</span>'
            +'<span class="standings-pts">'+mainScore+'</span>'
          +'</div>'
          +'</div>';
      }
      var hs=(p.hitsScored===null||p.hitsScored===undefined)?null:p.hitsScored;
      var denom=(hs!==null&&hs>=25)?25:100;
      mainScore=(hs===null?'--':hs)+'/'+denom;
      return '<div class="standings-row standings-row-flat '+rankClass+'">'
        +'<div class="standings-row-main">'
          +'<span class="standings-rank">'+(i+1)+'</span>'
          +'<span class="standings-name">'+safeName+'</span>'
          +'<span><span class="standings-pts">'+mainScore+'</span><span class="standings-pts-sub">Out Of: '+flashesDisplay+'</span></span>'
        +'</div>'
        +'</div>';
    }).join('');
  }).catch(function(){
    listEl.innerHTML='<div class="box-empty">Could not load standings right now — try again in a moment.</div>';
  });
}

function openStandings(){
  $('screen-intro').style.display='none';
  $('screen-game').style.display='none';
  $('screen-box').style.display='flex';
  if(!isFree())currentStandingsSpeed=currentSpeed;
  renderStandingsForPattern(isFree()?'free':currentPattern);
}

// One code opens everything now, so standings is simply another
// screen in this page — no separate gate to send anyone to.
$('openBoxBtn').addEventListener('click',function(){
  openStandings();
});

$('closeBoxBtn').addEventListener('click',function(){
  $('screen-box').style.display='none';
  $('screen-intro').style.display='flex';
});

$('introStartBtn').onclick=function(){
  var nameField=$('playerNameInputMain');
  var nm=nameField.value.trim();
  if(!nm){
    nameField.focus();
    nameField.style.borderColor='#FF1493';
    setTimeout(function(){nameField.style.borderColor=''},600);
    return;
  }
  launchGame(nm);
};
$('actBtn').onclick=function(){startRound()};
// Back on the intro screen leaves Ritnome entirely, so it goes to
// the hub. The in-game Home button just returns to this page's own
// intro screen.
$('introBackBtn').onclick=function(){window.location.href='dynamic-hub.html'};
$('menuBtn').onclick=function(){stopRound();window.location.href='ritnome.html'};
})();
</script>
